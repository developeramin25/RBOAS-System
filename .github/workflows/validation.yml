name: Validate RBOAS application
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  smoke-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check demo-bank.js
          node --input-type=module --check < auth-pages.js
      - name: Run application smoke tests
        run: node --test tests/*.test.cjs
