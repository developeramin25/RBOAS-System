<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta name="theme-color" content="#f4f8fd"/>
  <meta name="description" content="Remote Billing Onboarding Assessment System — secure employee training and assessment."/>
  <title>RBOAS | Remote Billing Onboarding Assessment System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/styles.css"/>
</head>
<body>
  <div id="app"><div class="boot"><div class="bootmark">R</div><p>Loading assessment workspace…</p></div></div>
  <dialog id="authDialog" class="auth-dialog" aria-labelledby="authTitle">
    <form id="loginForm" class="auth-form">
      <div class="auth-symbol">R</div>
      <h2 id="authTitle">Sign in to RBOAS</h2>
      <p>Use your authorized assessment system credentials. New trainee accounts are issued by an administrator.</p>
      <label for="loginEmail">Work email</label>
      <input id="loginEmail" name="email" type="email" required autocomplete="username" placeholder="you@company.com"/>
      <label for="loginPassword">Password</label>
      <input id="loginPassword" name="password" type="password" required autocomplete="current-password" placeholder="Enter password"/>
      <div id="loginMessage" class="form-message" role="status"></div>
      <button type="submit" class="primary full" id="loginSubmit">Sign in securely</button>
      <button type="button" class="text-button full" id="closeLogin">Back to design preview</button>
    </form>
  </dialog>
  <script src="/app.js" defer></script>
</body>
</html>
